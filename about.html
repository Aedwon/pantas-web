<style>

body{margin:0;background:#FBF9F4}
a{color:#1D5C50}a:hover{color:#174A41}
.pn-root{--bg:#FBF9F4;--surface:#FFFFFF;--ink:#26221B;--muted:#6E675C;--rule:#E5DFD3;--faint:#F1EDE4;--ctl:#8A8276;--board:#1D5C50;--board-h:#174A41;--board-p:#113A33;--tint:#E3EFEA;--tint-p:#CFE3DB;--rust:#A33B2E;--amber:#996A15;--g:20px;--s:.64;--ee:cubic-bezier(0.16,1,0.3,1);--es:cubic-bezier(0.2,0.8,0.2,1);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;min-width:320px}
.pn-root *{box-sizing:border-box}
.pn-root a:focus-visible,.pn-root button:focus-visible,.pn-root input:focus-visible{outline:3px solid #996A15;outline-offset:2px}
.pn-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pn-wrap{max-width:calc(1280px + 2 * var(--g));margin:0 auto;padding-inline:var(--g)}

/* header */
.pn-hdr-in{height:64px;display:flex;align-items:center;justify-content:space-between}
.pn-logo{display:inline-flex;align-items:center;gap:10px;min-height:48px;color:var(--ink);text-decoration:none;font-weight:700;font-size:20px;letter-spacing:-0.02em}
.pn-logo:hover{color:var(--ink)}
.pn-nav-d{display:none}
.pn-nl{font:inherit;font-size:16px;font-weight:600;line-height:1.2;color:var(--ink);background:none;border:0;padding:0 14px;height:48px;display:inline-flex;align-items:center;gap:6px;border-radius:12px;text-decoration:none;cursor:pointer;transition:background-color .12s var(--es)}
.pn-nl:hover{background:var(--faint);color:var(--ink)}
.pn-chev{transition:transform .18s var(--es)}
.pn-chev.up{transform:rotate(180deg)}
.pn-dd{position:relative}
.pn-ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 24px rgba(38,34,27,0.08);animation:pn-menu .18s var(--es) both}
.pn-ddm a{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:400;transition:background-color .12s var(--es)}
.pn-ddm a:hover{background:var(--tint)}
.pn-menubtn{width:48px;height:48px;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.pn-menubtn:hover{background:var(--faint)}
.pn-mpanel{position:absolute;left:0;right:0;top:64px;background:var(--surface);border-top:1px solid var(--faint);border-bottom:1px solid var(--rule);padding:8px var(--g) 24px;animation:pn-menu .18s var(--es) both}
.pn-mlist{list-style:none;margin:0;padding:0}
.pn-mi{display:flex;width:100%;height:48px;align-items:center;justify-content:space-between;font:inherit;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;background:none;border:0;border-bottom:1px solid var(--faint);padding:0;cursor:pointer;text-align:left}
.pn-mi:hover{color:var(--board)}
.pn-msub{list-style:none;margin:0;padding:0 0 0 16px}
.pn-msub .pn-mi{font-weight:400}

.pn-hdr{position:sticky;top:0;z-index:50;height:64px}
.pn-hdr-in{border:1px solid transparent;border-radius:0;background-color:rgba(255,255,255,0);transition:max-width .6s cubic-bezier(0.16,1,0.3,1),margin-top .65s cubic-bezier(.34,1.5,.55,1),height .5s cubic-bezier(0.16,1,0.3,1),padding .6s cubic-bezier(0.16,1,0.3,1),border-radius .5s cubic-bezier(0.16,1,0.3,1),background-color .35s ease,border-color .35s ease,box-shadow .5s ease}
.pn-hdr.is-float .pn-hdr-in{max-width:calc(100% - 16px);margin-top:8px;height:56px;padding-inline:8px 6px;border-radius:16px;background-color:#FFFFFF;border-color:#E5DFD3;box-shadow:0 12px 32px rgba(38,34,27,.10)}
.pn-hdr.is-float .pn-tassel{animation:pn-swing2 1.2s ease-in-out both}
.pn-hdr.is-docked:not(.is-float) .pn-tassel{animation:pn-swing 1.2s ease-in-out 0s both}
.pn-mpanel{transition:top .5s cubic-bezier(0.16,1,0.3,1)}
.pn-hdr.is-float .pn-mpanel{top:70px;left:8px;right:8px;border:1px solid #E5DFD3;border-radius:16px;box-shadow:0 12px 32px rgba(38,34,27,.10)}
@media (min-width:768px){
.pn-hdr{height:72px}
.pn-hdr.is-float .pn-hdr-in{max-width:min(1120px,calc(100% - 32px));margin-top:10px;height:60px;padding-inline:12px 8px;border-radius:18px}
}

/* buttons */
.pn-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border-radius:12px;background:var(--board);color:#FFFFFF;font:inherit;font-size:16px;font-weight:600;line-height:1.2;text-decoration:none;border:0;cursor:pointer;transition:background-color .12s var(--es),transform .12s var(--es)}
.pn-btn:hover{background:var(--board-h);color:#FFFFFF}
.pn-btn:active{background:var(--board-p);transform:scale(.98)}
.pn-btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;background:var(--surface);color:var(--board);border:1px solid var(--board);font:inherit;font-size:16px;font-weight:600;line-height:1.2;cursor:pointer;transition:background-color .12s var(--es),transform .12s var(--es)}
.pn-btn2:hover{background:var(--tint)}
.pn-btn2:active{background:var(--tint-p);transform:scale(.98)}
.pn-gp{display:inline-flex;flex-direction:column;justify-content:center;height:56px;min-width:176px;padding:0 22px;background:#000000;color:#FFFFFF;border-radius:10px;text-decoration:none;line-height:1.1;transition:transform .12s var(--es)}
.pn-gp:hover{color:#FFFFFF;transform:translateY(-2px)}
.pn-gp:active{transform:translateY(0) scale(.98)}
.pn-gp-s{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pn-gp-b{font-size:21px;font-weight:600;letter-spacing:-0.01em}


@media (min-width:480px){.pn-root{--g:24px}}
@media (min-width:768px){
.pn-root{--g:32px}
.pn-hdr-in{height:72px}
.pn-nav-d{display:flex;align-items:center;gap:4px}
.pn-nav-d .pn-btn{margin-left:12px}
.pn-menubtn,.pn-mpanel{display:none}
}
@media (min-width:1024px){.pn-root{--g:48px}}
@media (min-width:1280px){.pn-root{--g:64px}}

/* motion */
@keyframes pn-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pn-fade{from{opacity:0}to{opacity:1}}
@keyframes pn-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pn-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pn-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pn-sl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pn-sr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pn-su{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pn-wave{0%{transform:skewY(0)}25%{transform:skewY(-9deg)}55%{transform:skewY(6deg)}80%{transform:skewY(-2deg)}100%{transform:skewY(0)}}
@keyframes pn-wave2{0%{transform:skewY(0)}25%{transform:skewY(-9deg)}55%{transform:skewY(6deg)}80%{transform:skewY(-2deg)}100%{transform:skewY(0)}}
@keyframes pn-glow{0%{opacity:0}20%{opacity:.9}30%{opacity:.15}45%{opacity:.95}55%{opacity:.35}72%{opacity:.95}100%{opacity:.55}}
@keyframes pn-settle{from{opacity:0;transform:translateY(48px) rotate(14deg)}to{opacity:1;transform:rotate(6deg)}}
@keyframes pn-gauge{from{stroke-dashoffset:61}to{stroke-dashoffset:0}}
@keyframes pn-ring{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pn-out{from{opacity:1}to{opacity:0}}
@keyframes pn-menu{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pn-pop,.pn-sl,.pn-sr,.pn-su,.pn-wave{transform-box:fill-box;transform-origin:50% 50%}
.pn-grow{transform-box:fill-box;transform-origin:50% 100%}
.pn-wave{transform-origin:0% 50%}
.pn-glow{opacity:.5;transition:opacity .32s var(--es)}
.pn-anim .pn-rv .pn-up,.pn-anim .pn-rv .pn-pop,.pn-anim .pn-rv .pn-sl,.pn-anim .pn-rv .pn-sr,.pn-anim .pn-rv .pn-su,.pn-anim .pn-rv .pn-fade,.pn-anim .pn-rv .pn-glow,.pn-anim .pn-rv .pn-tilt{opacity:0}
.pn-anim .pn-rv .pn-grow{transform:scaleY(0)}
.pn-anim .pn-rv .pn-draw{stroke-dasharray:1 2;stroke-dashoffset:1}
.pn-anim .pn-rv .pn-gauge{stroke-dashoffset:61}
.pn-anim .pn-rv.in .pn-up{animation:pn-up .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-fade{animation:pn-fade .42s ease both}
.pn-anim .pn-rv.in .pn-pop{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) both}
.pn-anim .pn-rv.in .pn-sl{animation:pn-sl .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-sr{animation:pn-sr .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-su{animation:pn-su .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-grow{animation:pn-grow .6s var(--ee) both}
.pn-anim .pn-rv.in .pn-draw{animation:pn-draw .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-draw.pn-slow{animation-duration:1s}
.pn-anim .pn-rv.in .pn-wave{animation:pn-wave .9s ease-in-out both}
.pn-anim .pn-rv.in .pn-glow{animation:pn-glow 1.2s ease both}
.pn-anim .pn-rv.in .pn-tilt{animation:pn-settle .7s var(--ee) .15s both}
.pn-anim .pn-rv.in .pn-gauge{animation:pn-gauge .9s var(--ee) .8s both}
@keyframes pn-word{from{opacity:0;transform:translateY(.4em) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes pn-swing{0%{transform:rotate(0)}18%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}62%{transform:rotate(5deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes pn-swing2{0%{transform:rotate(0)}18%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}62%{transform:rotate(5deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes pn-tap{0%{opacity:0;transform:scale(.5)}35%{opacity:.35;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes pn-press{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
@keyframes pn-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pn-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}70%{transform:translateY(2px)}}
@keyframes pn-rise{from{opacity:0;transform:translateY(120px)}to{opacity:1;transform:none}}
@keyframes pn-fly{from{transform:translateX(-620px)}to{transform:translateX(1240px)}}
@keyframes pn-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes pn-sway{0%,100%{transform:skewX(0)}30%{transform:skewX(4deg)}65%{transform:skewX(-3deg)}}
@keyframes pn-bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}70%{transform:translateY(2px)}}
@keyframes pn-scrib{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,-6px)}40%{transform:translate(4px,-10px)}60%{transform:translate(10px,-2px)}80%{transform:translate(-2px,4px)}}
@keyframes pn-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes pn-blink2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes pn-shine{from{left:-60%}to{left:130%}}
@keyframes pn-spark{from{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}to{opacity:0;transform:rotate(var(--a)) translateX(30px) scale(.3)}}
.pn-w{display:inline-block}
.pn-ulw{position:relative}
.pn-ul{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.32em;overflow:visible}
.pn-tassel{transform-box:fill-box;transform-origin:50% 0}
.pn-anim .pn-tassel{animation:pn-swing 1.6s ease-in-out .6s both}
.pn-logo:hover .pn-tassel{animation:pn-swing2 1.4s ease-in-out both}
.pn-3d{width:100%;height:100%;transition:transform .32s var(--es)}
.pa-ring1{position:relative;width:24px;height:24px;flex-shrink:0}
.pa-ring1 svg{display:block}
.pn-r1prog{stroke-dasharray:100;stroke-dashoffset:100}
.pn-r1done{position:absolute;inset:0;border-radius:99px;background:#0B7A68;display:flex;align-items:center;justify-content:center;opacity:0}
.pa-btn{position:relative;overflow:hidden}
.pa-tap{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:99px;background:#FFFFFF;opacity:0}
.pn-growx{transform-box:fill-box;transform-origin:0 50%}
.pn-fan-b,.pn-fan-v,.pn-fan-q{transform-box:fill-box;transform-origin:50% 50%;transition:transform .42s var(--ee)}
.pn-art:hover .pn-fan-b{transform:translate(16px,-10px) rotate(4deg)}
.pn-art:hover .pn-fan-v{transform:translate(-14px,-8px) rotate(-5deg)}
.pn-art:hover .pn-fan-q{transform:translate(0,8px) rotate(1deg)}
.pn-hop{transform-box:fill-box;transform-origin:50% 100%}
.pn-art:hover .pn-hop{animation:pn-hop .5s var(--es) both}
.pn-art:hover .pn-h2{animation-delay:.06s}
.pn-art:hover .pn-h3{animation-delay:.12s}
.pn-art:hover .pn-h4{animation-delay:.18s}
.pn-art:hover .pn-h5{animation-delay:.24s}
.pn-rise,.pn-bob,.pn-scrib,.pn-blink,.pn-flap{transform-box:fill-box;transform-origin:50% 50%}
.pn-sway{transform-box:fill-box;transform-origin:50% 100%}
.pn-anim .pn-rv .pn-w,.pn-anim .pn-rv .pn-rise,.pn-anim .pn-rv .pn-traveler{opacity:0}
.pn-anim .pn-rv .pn-growx{transform:scaleX(0)}
.pn-anim .pn-rv.in .pn-w{animation:pn-word .6s var(--ee) both}
.pn-anim .pn-rv.in .pn-r1prog{animation:pn-ring .5s var(--es) 2.3s both}
.pn-anim .pn-rv.in .pn-r1done{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) 2.8s both}
.pn-anim .pn-rv.in .pa-tap{animation:pn-tap .6s ease 2s both}
.pn-anim .pn-rv.in .pa-btn{animation:pn-press .3s var(--es) 2.05s both}
.pn-anim .pn-rv.in .pn-hero-cta::after{animation:pn-shine .9s var(--es) 1.5s both}
.pn-anim .pn-rv.in .pn-growx{animation:pn-growx .9s var(--ee) both}
.pn-anim .pn-rv.in .pn-rise{animation:pn-rise 1.6s var(--ee) both}
.pn-anim .pn-rv.in .pn-fly{animation:pn-fly 11s linear both}
.pn-anim .pn-rv.in .pn-flap{animation:pn-flap .5s ease-in-out 12}
.pn-anim .pn-rv.in .pn-sway{animation:pn-sway 2.4s ease-in-out both}
.pn-anim .pn-rv.in .pn-bob{animation:pn-bob .7s var(--es) both}
.pn-anim .pn-rv.in .pn-scrib{animation:pn-scrib 1.1s ease-in-out both}
.pn-anim .pn-rv.in .pn-traveler{animation:pn-fade .2s ease 1s both}
/* roadmap: one route to exam day. Defaults are the final state (static / reduced motion). */
.pnx-done,.pnx-ring,.pnx-next,.pnx-rev,.pnx-callin{transform-box:fill-box;transform-origin:50% 50%}
.pnx-callin{transform-origin:50% 100%}
.pnx-prog{transform-box:fill-box;transform-origin:0 50%}
.pnx-ring{opacity:.12}
.pnx-call{transform:translateX(56px)}
.pnx-icA{opacity:0}
.pnx-arc{stroke-dasharray:1 2}
.pnx-s3{transform:translateX(-6px)}
.pnx-s4{transform:translateX(-12px)}
.pnx-s5{transform:translateX(32px)}
@keyframes pnx-prog{from{transform:scaleX(.349)}to{transform:scaleX(1)}}
@keyframes pnx-ring{0%{opacity:0;transform:scale(.6)}60%{opacity:.2;transform:scale(1.08)}100%{opacity:.12;transform:scale(1)}}
@keyframes pnx-slide{from{transform:none}}
@keyframes pnx-callin{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes pnx-swapout{0%{opacity:1}100%{opacity:0}}
.pn-anim .pn-rv.in .pnx-callin{animation:pnx-callin .42s cubic-bezier(.2,.9,.3,1) 1.2s both}
@keyframes pnx-icA{0%,92%{opacity:1}100%{opacity:0}}
.pn-anim .pn-rv.in .pnx-icA{animation:pnx-icA 2.45s linear both}
.pn-anim .pn-rv.in .pnx-icB{animation:pa-fade .25s ease 2.45s both}
.pn-anim .pn-rv.in .pnx-done{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) 1.9s both}
.pn-anim .pn-rv.in .pnx-prog{animation:pnx-prog .55s cubic-bezier(.3,.7,.3,1) 2.25s both}
.pn-anim .pn-rv.in .pnx-call{animation:pnx-slide .55s cubic-bezier(.2,.9,.3,1) 2.25s both}
.pn-anim .pn-rv.in .pnx-next{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) 2.6s both}
.pn-anim .pn-rv.in .pnx-ring{animation:pnx-ring .6s var(--es) 2.6s both}
.pn-anim .pn-rv.in .pnx-s3,.pn-anim .pn-rv.in .pnx-s4,.pn-anim .pn-rv.in .pnx-s5{animation:pnx-slide .6s cubic-bezier(.2,.9,.3,1) 3.2s both}
.pn-anim .pn-rv.in .pnx-arc{animation:pn-draw .8s cubic-bezier(.4,0,.2,1) 3.55s both}

.pn-anim .pn-rv.in .pnx-arrow{animation:pa-fade .2s ease 4.25s both}
.pnx-cal,.pnx-date{transform-box:fill-box;transform-origin:50% 50%}
@keyframes pnx-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.07)}}
.pn-anim .pn-rv.in .pnx-date{animation:pn-draw .5s var(--ee) 1.1s both}
.pnx-date{stroke-dasharray:1 2}
.pn-anim .pn-rv.in .pnx-cal{animation:pnx-pulse .5s var(--es) 4.6s both}
/* weak areas: the pen taps each box, then circles the weak row (pen path is driven by script) */
.pn-anim .pn-rv.in .pnw-c1{animation:pn-draw .3s ease .58s both}
.pn-anim .pn-rv.in .pnw-c2{animation:pn-draw .3s ease 1.08s both}

.pn-gp{position:relative;overflow:hidden}

.pn-anim .pn-rv.in .pn-d1{animation-delay:.1s}

.pn-anim .pn-rv.in .pn-d3{animation-delay:.3s}

/* chapter 1: hero + idea */
.ab-hero{padding:48px 0 96px}

/* chapter 4: future */

<p class="ab-p pn-up pn-d2">At the time, I was preparing for the Civil Service Examination. I wanted something beyond what already existed: reviewers and question banks. Those are useful, but I wanted something deeper and more systematic. Something that could meet me halfway, figure out what I needed to work on, and plan around the time I actually had to study.</p>

<p class="ab-statement pn-up">That became the idea for Pantas.</p>
<p class="ab-p pn-up pn-d1">As I started planning how I would build it, I realized the same system could be useful to other people too. If I could build something like this for myself, why not make it accessible to others who could use it as well?</p>

<h2 id="ab-who-h" class="ab-h2 pn-up">Who built Pantas</h2>
<p class="ab-open pn-up pn-d1">I'm Aerol, the sole developer of Pantas.</p>
<p class="ab-p pn-up pn-d2">I graduated from Philippine Science High School and later studied Computer Science at UP Diliman as a DOST Merit Scholar.</p>
<p class="ab-p pn-up pn-d3">Right now, I'm a one-man team. Everything you see, from the app itself to this website, is the result of me pouring my time and effort into making sure the experience feels as good as I can make it.</p>
<p class="ab-p pn-up pn-d4">I've also been seriously learning UI/UX design for the past year, and a lot of what I've learned has found its way into Pantas. I still have plenty of room to improve, but that honestly makes the project more exciting to me. As I get better, Pantas gets better too.</p>
<p class="ab-p pn-up pn-d5">I'm also part of the audience I built Pantas for. That means I'll always be particular about the little things and keep polishing the parts that might otherwise be overlooked, so that Pantas is wonderful to use not only for me, but for everyone.</p>
</div>
</div>

<p class="ab-p pn-up pn-d1">Frankly, there are already so many apps that try to do the same thing. Before writing any code, I spent a lot of time researching the best and proven ways to study for these exams effectively.</p>

<h3 class="ab-h3 pn-up pn-d1">Self-assessment</h3>
<p class="ab-p pn-up pn-d2">This is something most products, and often self-study itself, fail to address: not everyone starts at the same point.</p>
<p class="ab-p pn-up pn-d3">We all have different levels of mastery across different subjects, so I thought it made sense for Pantas to first assess what you already know. That gives you a clear baseline for where to start and what actually needs your attention.</p>
</article>

<h3 class="ab-h3 pn-up pn-d1">Spaced repetition</h3>
<p class="ab-p pn-up pn-d2">Pantas estimates how well you remember what you've studied and uses that to decide when you should see it again.</p>
<p class="ab-p pn-up pn-d3">Instead of reviewing everything equally, lessons and questions can return when your memory is starting to fade, helping you refresh what you've learned before it gets lost.</p>
</article>

<h3 class="ab-h3 pn-up pn-d1">Elaborated mistakes</h3>
<p class="ab-p pn-up pn-d2">When you get an answer wrong, Pantas tells you why your answer was wrong, not just why another answer is right.</p>
<p class="ab-p pn-up pn-d3">Questions are also intentionally written with meaningful distractors, so mistakes can reveal what you misunderstood instead of simply telling you that you missed the correct choice.</p>
</article>

<p class="ab-p pn-up pn-d2">Beyond that, I want it to keep expanding into more exams, improve the way lessons and practice are delivered, create programs that benefit more learners, and help make good preparation less dependent on how much privilege someone starts with.</p>

            }
          });

      }
    }
    this.onDoc = function (e) {
      if (!self.state.menu && !self.state.comp) return;
      var t = e.target;

  }
  componentWillUnmount() {

    var s = this.state;
    var self = this;
    return {
      menuOpen: s.menu,
      menuClosed: !s.menu,
      menuExp: s.menu ? 'true' : 'false',
      menuLabel: s.menu ? 'Close menu' : 'Open menu',
      compOpen: s.comp,
      compExp: s.comp ? 'true' : 'false',
      chevClass: s.comp ? 'pn-chev up' : 'pn-chev',
      mcompOpen: s.mcomp,
      mcompExp: s.mcomp ? 'true' : 'false',
      mchevClass: s.mcomp ? 'pn-chev up' : 'pn-chev',
      toggleMenu: function () { self.setState({ menu: !self.state.menu, mcomp: false }); },
      toggleComp: function () { self.setState({ comp: !self.state.comp }); },
      toggleMComp: function () { self.setState({ mcomp: !self.state.mcomp }); },
      closeAll: function () { self.setState({ menu: false, comp: false, mcomp: false }); },
      onKey: function (e) {
        if (e.key !== 'Escape' || (!self.state.menu && !self.state.comp)) return;
        var sel = self.state.menu ? '.pn-menubtn' : '.pn-compbtn';
        self.setState({ menu: false, comp: false, mcomp: false });
        var b = document.querySelector(sel);
        if (b) b.focus();
      }
    };
  }
}
