<style>

body{margin:0;background:#FBF9F4}
a{color:#1D5C50}a:hover{color:#174A41}
.pn-root{--bg:#FBF9F4;--surface:#FFFFFF;--ink:#26221B;--muted:#6E675C;--rule:#E5DFD3;--faint:#F1EDE4;--ctl:#8A8276;--board:#1D5C50;--board-h:#174A41;--board-p:#113A33;--tint:#E3EFEA;--tint-p:#CFE3DB;--rust:#A33B2E;--amber:#996A15;--g:20px;--s:.64;--ee:cubic-bezier(0.16,1,0.3,1);--es:cubic-bezier(0.2,0.8,0.2,1);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip;min-width:320px}
.pn-root *{box-sizing:border-box}
.pn-root a:focus-visible,.pn-root button:focus-visible,.pn-root input:focus-visible{outline:3px solid #996A15;outline-offset:2px}
.pn-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pn-wrap{max-width:calc(1280px + 2 * var(--g));margin:0 auto;padding-inline:var(--g)}

/* header */
.pn-hdr-in{height:64px;display:flex;align-items:center;justify-content:space-between}
.pn-logo{display:inline-flex;align-items:center;gap:10px;min-height:48px;color:var(--ink);text-decoration:none;font-weight:700;font-size:20px;letter-spacing:-0.02em}
.pn-logo:hover{color:var(--ink)}
.pn-nav-d{display:none}
.pn-nl{font:inherit;font-size:16px;font-weight:600;line-height:1.2;color:var(--ink);background:none;border:0;padding:0 14px;height:48px;display:inline-flex;align-items:center;gap:6px;border-radius:12px;text-decoration:none;cursor:pointer;transition:background-color .12s var(--es)}
.pn-nl:hover{background:var(--faint);color:var(--ink)}
.pn-chev{transition:transform .18s var(--es)}
.pn-chev.up{transform:rotate(180deg)}
.pn-dd{position:relative}
.pn-ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 24px rgba(38,34,27,0.08);animation:pn-menu .18s var(--es) both}
.pn-ddm a{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:400;transition:background-color .12s var(--es)}
.pn-ddm a:hover{background:var(--tint)}
.pn-menubtn{width:48px;height:48px;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.pn-menubtn:hover{background:var(--faint)}
.pn-mpanel{position:absolute;left:0;right:0;top:64px;background:var(--surface);border-top:1px solid var(--faint);border-bottom:1px solid var(--rule);padding:8px var(--g) 24px;animation:pn-menu .18s var(--es) both}
.pn-mlist{list-style:none;margin:0;padding:0}
.pn-mi{display:flex;width:100%;height:48px;align-items:center;justify-content:space-between;font:inherit;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;background:none;border:0;border-bottom:1px solid var(--faint);padding:0;cursor:pointer;text-align:left}
.pn-mi:hover{color:var(--board)}
.pn-msub{list-style:none;margin:0;padding:0 0 0 16px}
.pn-msub .pn-mi{font-weight:400}

.pn-hdr{position:sticky;top:0;z-index:50;height:64px}
.pn-hdr-in{border:1px solid transparent;border-radius:0;background-color:rgba(255,255,255,0);transition:max-width .6s cubic-bezier(0.16,1,0.3,1),margin-top .65s cubic-bezier(.34,1.5,.55,1),height .5s cubic-bezier(0.16,1,0.3,1),padding .6s cubic-bezier(0.16,1,0.3,1),border-radius .5s cubic-bezier(0.16,1,0.3,1),background-color .35s ease,border-color .35s ease,box-shadow .5s ease}
.pn-hdr.is-float .pn-hdr-in{max-width:calc(100% - 16px);margin-top:8px;height:56px;padding-inline:8px 6px;border-radius:16px;background-color:rgba(255,255,255,.96);border-color:#E5DFD3;box-shadow:0 12px 32px rgba(38,34,27,.10)}
.pn-hdr.is-float .pn-tassel{animation:pn-swing2 1.2s ease-in-out both}
.pn-hdr.is-docked:not(.is-float) .pn-tassel{animation:pn-swing 1.2s ease-in-out 0s both}
.pn-mpanel{transition:top .5s cubic-bezier(0.16,1,0.3,1)}
.pn-hdr.is-float .pn-mpanel{top:70px;left:8px;right:8px;border:1px solid #E5DFD3;border-radius:16px;box-shadow:0 12px 32px rgba(38,34,27,.10)}
@media (min-width:768px){
.pn-hdr{height:72px}
.pn-hdr.is-float .pn-hdr-in{max-width:min(1120px,calc(100% - 32px));margin-top:10px;height:60px;padding-inline:12px 8px;border-radius:18px}
}

/* buttons */
.pn-btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border-radius:12px;background:var(--board);color:#FFFFFF;font:inherit;font-size:16px;font-weight:600;line-height:1.2;text-decoration:none;border:0;cursor:pointer;transition:background-color .12s var(--es),transform .12s var(--es)}
.pn-btn:hover{background:var(--board-h);color:#FFFFFF}
.pn-btn:active{background:var(--board-p);transform:scale(.98)}
.pn-btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;background:var(--surface);color:var(--board);border:1px solid var(--board);font:inherit;font-size:16px;font-weight:600;line-height:1.2;cursor:pointer;transition:background-color .12s var(--es),transform .12s var(--es)}
.pn-btn2:hover{background:var(--tint)}
.pn-btn2:active{background:var(--tint-p);transform:scale(.98)}
.pn-gp{display:inline-flex;flex-direction:column;justify-content:center;height:56px;min-width:176px;padding:0 22px;background:#000000;color:#FFFFFF;border-radius:10px;text-decoration:none;line-height:1.1;transition:transform .12s var(--es)}
.pn-gp:hover{color:#FFFFFF;transform:translateY(-2px)}
.pn-gp:active{transform:translateY(0) scale(.98)}
.pn-gp-s{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.pn-gp-b{font-size:21px;font-weight:600;letter-spacing:-0.01em}


@media (min-width:480px){.pn-root{--g:24px}}
@media (min-width:768px){
.pn-root{--g:32px}
.pn-hdr-in{height:72px}
.pn-nav-d{display:flex;align-items:center;gap:4px}
.pn-nav-d .pn-btn{margin-left:12px}
.pn-menubtn,.pn-mpanel{display:none}
}
@media (min-width:1024px){.pn-root{--g:48px}}
@media (min-width:1280px){.pn-root{--g:64px}}

/* motion */
@keyframes pn-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pn-fade{from{opacity:0}to{opacity:1}}
@keyframes pn-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes pn-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pn-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pn-sl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pn-sr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pn-su{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pn-wave{0%{transform:skewY(0)}25%{transform:skewY(-9deg)}55%{transform:skewY(6deg)}80%{transform:skewY(-2deg)}100%{transform:skewY(0)}}
@keyframes pn-wave2{0%{transform:skewY(0)}25%{transform:skewY(-9deg)}55%{transform:skewY(6deg)}80%{transform:skewY(-2deg)}100%{transform:skewY(0)}}
@keyframes pn-glow{0%{opacity:0}20%{opacity:.9}30%{opacity:.15}45%{opacity:.95}55%{opacity:.35}72%{opacity:.95}100%{opacity:.55}}
@keyframes pn-settle{from{opacity:0;transform:translateY(48px) rotate(14deg)}to{opacity:1;transform:rotate(6deg)}}
@keyframes pn-gauge{from{stroke-dashoffset:61}to{stroke-dashoffset:0}}
@keyframes pn-ring{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pn-out{from{opacity:1}to{opacity:0}}
@keyframes pn-menu{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pn-pop,.pn-sl,.pn-sr,.pn-su,.pn-wave{transform-box:fill-box;transform-origin:50% 50%}
.pn-grow{transform-box:fill-box;transform-origin:50% 100%}
.pn-wave{transform-origin:0% 50%}
.pn-glow{opacity:.5;transition:opacity .32s var(--es)}
.pn-anim .pn-rv .pn-up,.pn-anim .pn-rv .pn-pop,.pn-anim .pn-rv .pn-sl,.pn-anim .pn-rv .pn-sr,.pn-anim .pn-rv .pn-su,.pn-anim .pn-rv .pn-fade,.pn-anim .pn-rv .pn-glow,.pn-anim .pn-rv .pn-tilt{opacity:0}
.pn-anim .pn-rv .pn-grow{transform:scaleY(0)}
.pn-anim .pn-rv .pn-draw{stroke-dasharray:1 2;stroke-dashoffset:1}
.pn-anim .pn-rv .pn-gauge{stroke-dashoffset:61}
.pn-anim .pn-rv.in .pn-up{animation:pn-up .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-fade{animation:pn-fade .42s ease both}
.pn-anim .pn-rv.in .pn-pop{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) both}
.pn-anim .pn-rv.in .pn-sl{animation:pn-sl .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-sr{animation:pn-sr .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-su{animation:pn-su .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-grow{animation:pn-grow .6s var(--ee) both}
.pn-anim .pn-rv.in .pn-draw{animation:pn-draw .42s var(--ee) both}
.pn-anim .pn-rv.in .pn-draw.pn-slow{animation-duration:1s}
.pn-anim .pn-rv.in .pn-wave{animation:pn-wave .9s ease-in-out both}
.pn-anim .pn-rv.in .pn-glow{animation:pn-glow 1.2s ease both}
.pn-anim .pn-rv.in .pn-tilt{animation:pn-settle .7s var(--ee) .15s both}
.pn-anim .pn-rv.in .pn-gauge{animation:pn-gauge .9s var(--ee) .8s both}
@keyframes pn-word{from{opacity:0;transform:translateY(.4em) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes pn-swing{0%{transform:rotate(0)}18%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}62%{transform:rotate(5deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes pn-swing2{0%{transform:rotate(0)}18%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}62%{transform:rotate(5deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes pn-tap{0%{opacity:0;transform:scale(.5)}35%{opacity:.35;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@keyframes pn-press{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
@keyframes pn-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pn-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}70%{transform:translateY(2px)}}
@keyframes pn-rise{from{opacity:0;transform:translateY(120px)}to{opacity:1;transform:none}}
@keyframes pn-fly{from{transform:translateX(-620px)}to{transform:translateX(1240px)}}
@keyframes pn-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes pn-sway{0%,100%{transform:skewX(0)}30%{transform:skewX(4deg)}65%{transform:skewX(-3deg)}}
@keyframes pn-bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}70%{transform:translateY(2px)}}
@keyframes pn-scrib{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,-6px)}40%{transform:translate(4px,-10px)}60%{transform:translate(10px,-2px)}80%{transform:translate(-2px,4px)}}
@keyframes pn-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes pn-blink2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes pn-shine{from{left:-60%}to{left:130%}}
@keyframes pn-spark{from{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}to{opacity:0;transform:rotate(var(--a)) translateX(30px) scale(.3)}}
.pn-w{display:inline-block}
.pn-ulw{position:relative}
.pn-ul{position:absolute;left:-2%;bottom:-.16em;width:104%;height:.32em;overflow:visible}
.pn-tassel{transform-box:fill-box;transform-origin:50% 0}
.pn-anim .pn-tassel{animation:pn-swing 1.6s ease-in-out .6s both}
.pn-logo:hover .pn-tassel{animation:pn-swing2 1.4s ease-in-out both}
.pn-3d{width:100%;height:100%;transition:transform .32s var(--es)}
.pa-ring1{position:relative;width:24px;height:24px;flex-shrink:0}
.pa-ring1 svg{display:block}
.pn-r1prog{stroke-dasharray:100;stroke-dashoffset:100}
.pn-r1done{position:absolute;inset:0;border-radius:99px;background:#0B7A68;display:flex;align-items:center;justify-content:center;opacity:0}
.pa-btn{position:relative;overflow:hidden}
.pa-tap{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:99px;background:#FFFFFF;opacity:0}
.pn-growx{transform-box:fill-box;transform-origin:0 50%}
.pn-fan-b,.pn-fan-v,.pn-fan-q{transform-box:fill-box;transform-origin:50% 50%;transition:transform .42s var(--ee)}
.pn-art:hover .pn-fan-b{transform:translate(16px,-10px) rotate(4deg)}
.pn-art:hover .pn-fan-v{transform:translate(-14px,-8px) rotate(-5deg)}
.pn-art:hover .pn-fan-q{transform:translate(0,8px) rotate(1deg)}
.pn-hop{transform-box:fill-box;transform-origin:50% 100%}
.pn-art:hover .pn-hop{animation:pn-hop .5s var(--es) both}
.pn-art:hover .pn-h2{animation-delay:.06s}
.pn-art:hover .pn-h3{animation-delay:.12s}
.pn-art:hover .pn-h4{animation-delay:.18s}
.pn-art:hover .pn-h5{animation-delay:.24s}
.pn-rise,.pn-bob,.pn-scrib,.pn-blink,.pn-flap{transform-box:fill-box;transform-origin:50% 50%}
.pn-sway{transform-box:fill-box;transform-origin:50% 100%}
.pn-anim .pn-rv .pn-w,.pn-anim .pn-rv .pn-rise,.pn-anim .pn-rv .pn-traveler{opacity:0}
.pn-anim .pn-rv .pn-growx{transform:scaleX(0)}
.pn-anim .pn-rv.in .pn-w{animation:pn-word .6s var(--ee) both}
.pn-anim .pn-rv.in .pn-r1prog{animation:pn-ring .5s var(--es) 2.3s both}
.pn-anim .pn-rv.in .pn-r1done{animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) 2.8s both}
.pn-anim .pn-rv.in .pa-tap{animation:pn-tap .6s ease 2s both}

.pn-anim .pn-rv.in .pn-hero-cta::after{animation:pn-shine .9s var(--es) 1.5s both}
.pn-anim .pn-rv.in .pn-growx{animation:pn-growx .9s var(--ee) both}
.pn-anim .pn-rv.in .pn-rise{animation:pn-rise 1.6s var(--ee) both}
.pn-anim .pn-rv.in .pn-fly{animation:pn-fly 11s linear both}
.pn-anim .pn-rv.in .pn-flap{animation:pn-flap .5s ease-in-out 12}
.pn-anim .pn-rv.in .pn-sway{animation:pn-sway 2.4s ease-in-out both}
.pn-anim .pn-rv.in .pn-bob{animation:pn-bob .7s var(--es) both}
.pn-anim .pn-rv.in .pn-scrib{animation:pn-scrib 1.1s ease-in-out both}
.pn-anim .pn-rv.in .pn-traveler{animation:pn-fade .2s ease 1s both}
/* roadmap: one route to exam day. Defaults are the final state (static / reduced motion). */
.pnx-done,.pnx-ring,.pnx-next,.pnx-rev,.pnx-callin{transform-box:fill-box;transform-origin:50% 50%}
.pnx-callin{transform-origin:50% 100%}
.pnx-prog{transform-box:fill-box;transform-origin:0 50%}
.pnx-ring{opacity:.12}
.pnx-call{transform:translateX(56px)}
.pnx-icA{opacity:0}
.pnx-arc{stroke-dasharray:1 2}
.pnx-s3{transform:translateX(-6px)}
.pnx-s4{transform:translateX(-12px)}
.pnx-s5{transform:translateX(32px)}
@keyframes pnx-prog{from{transform:scaleX(.349)}to{transform:scaleX(1)}}
@keyframes pnx-ring{0%{opacity:0;transform:scale(.6)}60%{opacity:.2;transform:scale(1.08)}100%{opacity:.12;transform:scale(1)}}
@keyframes pnx-slide{from{transform:none}}
@keyframes pnx-callin{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}

.pn-anim .pn-rv.in .pnx-s3,.pn-anim .pn-rv.in .pnx-s4,.pn-anim .pn-rv.in .pnx-s5{animation:pnx-slide .6s cubic-bezier(.2,.9,.3,1) 3.2s both}

.pn-anim .pn-rv.in .pn-d7{animation-delay:.82s}
.pn-anim .pn-rv.in .pn-d8{animation-delay:1s}
.pn-anim .pn-rv.in .pn-d9{animation-delay:1.2s}
.pn-anim .pn-rv.in .pn-d10{animation-delay:1.4s}
.pn-anim .pn-rv.in .pn-d11{animation-delay:1.6s}
.pn-anim .pn-rv.in .pn-d12{animation-delay:1.9s}
.pn-anim .pn-rv.in .pn-d13{animation-delay:2.2s}
.pn-anim .pn-rv.in .pn-d14{animation-delay:2.6s}
.pn-anim .pn-rv.in .pn-d15{animation-delay:2.9s}
.pn-anim .pn-rv.in .pn-d16{animation-delay:3.2s}
.pn-art:hover .pn-wave,.pn-anim .pn-rv.in .pn-art:hover .pn-wave{animation:pn-wave2 .9s ease-in-out 0s both}
.pn-art:hover .pn-glow,.pn-anim .pn-rv.in .pn-art:hover .pn-glow{animation:none;opacity:.95}

.pn-nl.pn-cur{color:var(--board);background:var(--tint)}
.pn-ddm a.pn-cur{color:var(--board);font-weight:600;background:var(--tint)}
.pn-mi.pn-cur{color:var(--board)}
/* ---------- Contact page ---------- */
.ct-hero{padding:48px 0 96px}
.ct-h1{margin:0 0 56px;font-size:clamp(42px,6vw,80px);font-weight:700;line-height:.98;letter-spacing:-0.045em}
.ct-routes{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:56px}
.ct-route{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.ct-route-art{width:200px;margin-bottom:8px}
.ct-route-art svg{display:block;width:100%;height:auto;overflow:visible}
.ct-h2{margin:0;font-size:clamp(24px,2.3vw,32px);font-weight:700;line-height:1.12;letter-spacing:-0.02em}
.ct-p{margin:0;max-width:26rem;font-size:clamp(17px,1.3vw,18px);line-height:1.6;color:var(--muted);flex-grow:1}
.ct-route .pn-btn,.ct-route .pn-btn2{margin-top:10px;text-decoration:none;gap:8px;width:252px;max-width:100%;justify-content:center}
.ct-hr{display:block;height:1px;border:0;margin:0;background:var(--rule)}

.ct-form-sec{padding:32px 0 128px}
.ct-form-in{display:flex;flex-direction:column;gap:40px}
.ct-form-head{display:flex;flex-direction:column;gap:24px}
.ct-h2b{margin:0;font-size:clamp(30px,3vw,40px);font-weight:700;line-height:1.08;letter-spacing:-0.025em}
.ct-plane{width:100%;max-width:300px}
.ct-plane svg{display:block;width:100%;height:auto;overflow:visible}
.ct-form{display:flex;flex-direction:column;gap:28px;width:100%;max-width:640px}
.ct-row{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.ct-field{display:flex;flex-direction:column;gap:8px;min-width:0}
.ct-lbl{font-size:16px;font-weight:600;line-height:1.2;display:flex;align-items:baseline;gap:8px}
.ct-opt-tag{font-size:14px;font-weight:400;color:var(--muted)}
.ct-in{width:100%;height:48px;padding:0 16px;border-radius:12px;border:1px solid #8A8276;background:var(--surface);font:inherit;font-size:16px;color:var(--ink);transition:border-color .12s var(--es)}
.ct-ta{height:auto;min-height:144px;padding:12px 16px;resize:vertical;line-height:1.5}
.ct-num{max-width:220px}
.ct-in:focus{border-color:var(--board);outline:3px solid #996A15;outline-offset:2px}
.ct-in.bad{border-color:var(--rust)}
.ct-err{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--rust)}
.ct-fs{border:0;margin:0;padding:0;min-width:0}
.ct-fs legend{padding:0;margin-bottom:12px;font-size:16px;font-weight:600;line-height:1.2}
.ct-opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ct-opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font-size:16px;cursor:pointer;transition:border-color .12s var(--es),background-color .12s var(--es)}
.ct-opt:hover{border-color:#8A8276}
.ct-opt input{width:20px;height:20px;margin:0;accent-color:#1D5C50;flex-shrink:0}
.ct-opt:has(input:checked){border-color:var(--board);background:var(--tint)}
.ct-opt:has(input:focus-visible){outline:3px solid #996A15;outline-offset:2px}
.ct-fs.bad .ct-opt{border-color:#D9A39A}
.ct-submit{align-self:flex-start;gap:8px}
.ct-submit svg{transition:transform .12s var(--es)}
.ct-submit:hover svg{transform:translate(2px,-2px)}
.ct-ok{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:40px;border-radius:20px;background:var(--surface);border:1px solid var(--rule);max-width:640px;animation:pn-menu .32s var(--ee) both}
.ct-ok-ic{position:relative;width:56px;height:56px;border-radius:99px;background:var(--board);display:inline-flex;align-items:center;justify-content:center;animation:pn-pop .42s cubic-bezier(.34,1.4,.64,1) both}
.ct-ok-t{margin:0;font-size:clamp(24px,2.3vw,32px);font-weight:700;line-height:1.12;letter-spacing:-0.02em}
.ct-ok-p{margin:0;font-size:18px;line-height:1.6;color:var(--muted)}
.ct-ok .pn-btn2{margin-top:8px}

.ct-back{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;margin:0 0 24px -8px;border:0;border-radius:12px;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--board);cursor:pointer;transition:background-color .12s var(--es)}
.ct-back:hover{background:var(--tint)}
.ct-back svg{transition:transform .12s var(--es)}
.ct-back:hover svg{transform:translateX(-3px)}
.ct-fh:focus{outline:none}
.ct-start{position:relative;overflow:visible}
.ct-start-t{display:inline-flex;align-items:center;gap:8px;transition:opacity .2s var(--es)}
.ct-launch{position:absolute;z-index:3;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;pointer-events:none}
.ct-launch svg{display:block}
.ct-burst{position:absolute;left:50%;top:50%;width:0;height:0}
.ct-burst .pn-spark{left:0;top:0}

.ct-main{position:relative}
.ct-fly{position:absolute;left:0;top:0;width:90px;height:82px;margin:-41px 0 0 -45px;pointer-events:none;opacity:0;z-index:20;transform-origin:50% 50%;will-change:transform}
.ct-fly svg{display:block}
.ct-trailx{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:19;opacity:0}
@keyframes ct-settle{0%{transform:translateY(0)}40%{transform:translateY(5px)}100%{transform:translateY(0)}}
.pn-anim .ct-trail{stroke-dasharray:1 2;stroke-dashoffset:1}
.pn-anim .ct-landed .ct-trail{stroke-dashoffset:0}
.pn-anim .ct-form-sec .ct-flyer{opacity:0;animation:none}
.pn-anim .ct-form-sec.ct-landed .ct-flyer{opacity:1;animation:none}


/* contact motion */
@keyframes ct-out{to{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes ct-h1out{to{opacity:0;transform:translateY(-10px)}}
@keyframes ct-pick{0%{transform:none}25%{transform:translateY(-8px)}100%{opacity:0;transform:translateY(-28px)}}
@keyframes ct-press{0%{transform:scale(1)}30%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes ct-launch{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}12%{opacity:1;transform:translate(0,0) rotate(-8deg) scale(1)}100%{opacity:0;transform:translate(420px,-300px) rotate(8deg) scale(1.5)}}
.ct-fade .ct-h1{animation:ct-h1out .4s var(--es) both !important}
.ct-fade .ct-route{animation:ct-out .4s var(--es) both}
.ct-leave .ct-start{animation:ct-press .35s var(--es) both !important;opacity:1 !important}
.ct-start .ct-ico{display:inline-flex;transition:opacity .15s var(--es),transform .15s var(--es)}
.ct-leave .ct-ico{opacity:0;transform:translate(4px,-4px)}
.ct-start:hover .ct-ico{transform:translate(2px,-2px)}
.ct-leave .pn-route-line{opacity:0}
@keyframes ct-dot{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes ct-spin{from{opacity:0;transform:rotate(-140deg) scale(.7)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes ct-fly{0%{opacity:0;transform:translate(-60px,40px) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0)}}
@keyframes ct-zap{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.ct-dot,.ct-buoy,.ct-flyer,.ct-zap{transform-box:fill-box;transform-origin:50% 50%}
.ct-zap{opacity:0}
.pn-anim .pn-rv .ct-buoy{opacity:0}
.pn-anim .pn-rv.in .ct-dot{animation:ct-dot .6s ease-in-out 1.2s 3}
.pn-anim .pn-rv.in .ct-dot2{animation-delay:1.35s}
.pn-anim .pn-rv.in .ct-dot3{animation-delay:1.5s}
.pn-anim .pn-rv.in .ct-buoy{animation:ct-spin 1s var(--ee) .4s both}
.pn-anim .pn-rv.in .ct-zap{animation:ct-zap .8s var(--es) 1.6s both}
.ct-route:hover .ct-buoy{animation:ct-spin .8s var(--ee) both}


@media (min-width:768px){
.ct-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.ct-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1024px){
.ct-hero{padding:64px 0 128px}
.ct-routes{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.ct-route{padding:0 40px;border-left:1px solid var(--rule)}
.ct-route:first-child{padding-left:0;border-left:0}
.ct-route:last-child{padding-right:0}
.ct-form-sec{padding:40px 0 160px}
.ct-form-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:32px;align-items:start}
.ct-form-head{grid-column:1 / span 4;position:sticky;top:32px}
.ct-form-wrap{grid-column:6 / span 7}
}

/* send: plane departs, form folds away, confirmation */
@keyframes ct-fieldout{to{opacity:0;transform:translateY(-10px)}}
@keyframes ct-okin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ct-fillin{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes ct-return{from{opacity:0;transform:translate(-14px,10px)}to{opacity:1;transform:none}}
.ct-form-sec .ct-flyer{transition:opacity .35s var(--es)}
.ct-form-sec .ct-trail{transition:opacity .6s var(--es)}
.pn-anim .pn-rv.in .ct-sending > *{animation:ct-fieldout .32s var(--es) both;pointer-events:none}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(1){animation-delay:.02s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(2){animation-delay:.06s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(3){animation-delay:.1s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(4){animation-delay:.14s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(5){animation-delay:.18s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(6){animation-delay:.22s}
.pn-anim .pn-rv.in .ct-sending > *:nth-last-child(7){animation-delay:.26s}
.ct-ok{animation:none;padding:40px 40px 36px}
.ct-ok-ic{width:64px;height:64px;background:none;border-radius:0;animation:none}
.ct-ok-ic svg{display:block;overflow:visible}
.pn-anim .ct-ok{animation:ct-okin .45s var(--ee) both}
.pn-anim .ct-ok-ring{stroke-dasharray:1 2;stroke-dashoffset:1;fill-opacity:0;animation:pn-draw .7s var(--ee) .15s both,ct-fillin .4s ease .7s both}
.pn-anim .ct-ok-chk{stroke-dasharray:1 2;stroke-dashoffset:1;animation:pn-draw .4s var(--ee) .75s both}
.pn-anim .ct-ok-a1{animation:ct-okin .45s var(--ee) .35s both}
.pn-anim .ct-ok-a2{animation:ct-okin .45s var(--ee) .48s both}
.pn-anim .ct-ok-a3{animation:ct-okin .45s var(--ee) .62s both}

/* the inquiry folds into a paper plane */
.ct-sheet{position:absolute;left:0;top:0;width:220px;height:280px;opacity:0;pointer-events:none;z-index:21;transform-origin:0 0;perspective:900px}
.ct-sh-l,.ct-sh-rf,.ct-sh-rb{position:absolute;top:0;height:100%;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0 38px,#EFEAE0 38px 40px);background-position:0 36px;box-shadow:0 10px 30px rgba(38,34,27,.10)}
.ct-sh-l{left:0;width:50%;border-radius:10px 0 0 10px;border:1px solid #E5DFD3;border-right:0}
.ct-sh-r{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.ct-sh-rf{left:0;width:100%;border-radius:0 10px 10px 0;border:1px solid #E5DFD3;border-left:0;backface-visibility:hidden}
.ct-sh-rb{left:0;width:100%;border-radius:10px 0 0 10px;background-color:#F6F3EC;transform:rotateY(180deg);backface-visibility:hidden;border:1px solid #E5DFD3}
.ct-ink{position:absolute;left:12%;height:5px;border-radius:3px;background:#B9CFC6;transform:scaleX(0);transform-origin:0 50%}
.ct-sh-rf .ct-ink{left:8%}
.ct-sh-tri{position:absolute;left:0;top:0;width:50%;height:110px;background:#ECE6DA;clip-path:polygon(0 0,100% 0,0 100%);transform-origin:50% 0;opacity:0}

.ct-departed .ct-flyer{opacity:0 !important;transition:none}
.ct-departed .ct-trail{opacity:0;transition:opacity .5s var(--es) .2s}
@keyframes ct-back{from{opacity:0;transform:translate(40px,-34px) rotate(-6deg)}to{opacity:1;transform:none}}
.pn-anim .ct-form-sec.ct-landed.ct-returned .ct-flyer{animation:ct-back .7s var(--ee) both}

/* after sending: the plane keeps flying */
.ct-ok{padding:12px 12px 36px;gap:14px}
.ct-ok .ct-ok-t,.ct-ok .ct-ok-p,.ct-ok .pn-btn2{margin-left:28px;margin-right:28px}
.ct-ok .ct-ok-t{margin-top:16px}
.ct-sky{position:relative;align-self:stretch;height:180px;border-radius:14px;background:#E3EFEA;overflow:hidden}
.ct-cloud{position:absolute;left:0;width:84px;height:22px;border-radius:999px;background:#FFFFFF;opacity:.95}
.ct-cloud::before,.ct-cloud::after{content:"";position:absolute;bottom:8px;border-radius:999px;background:#FFFFFF}
.ct-cloud::before{left:14px;width:30px;height:30px}
.ct-cloud::after{left:36px;width:38px;height:38px}
.ct-c1{top:34px}.ct-c2{top:112px;transform:scale(.7)}.ct-c3{top:70px;transform:scale(.5);opacity:.8}.ct-c4{top:142px;transform:scale(.9)}
.ct-wind{position:absolute;left:0;height:2px;width:46px;border-radius:2px;background:#FFFFFF;opacity:0}
.ct-w1{top:72px}.ct-w2{top:104px;width:30px}.ct-w3{top:128px;width:38px}
.ct-cruise{position:absolute;left:42%;top:50%;width:90px;height:82px;margin:-41px 0 0 -45px;transform:rotate(20deg)}
.ct-cruise-b svg{display:block}
.pn-anim .ct-cruise{opacity:0}
.ct-cruising .ct-cruise{opacity:1}
@keyframes ct-drift{from{transform:translateX(var(--x0,640px)) scale(var(--s,1))}to{transform:translateX(-140px) scale(var(--s,1))}}
@keyframes ct-gust{0%{opacity:0;transform:translateX(560px)}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;transform:translateX(-80px)}}
@keyframes ct-bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translate(-2px,-6px) rotate(-2deg)}75%{transform:translate(2px,5px) rotate(1.5deg)}}
.pn-anim .ct-cloud{animation:ct-drift linear infinite}
.ct-c1{--s:1;animation-duration:14s !important;animation-delay:-3s !important}
.ct-c2{--s:.7;animation-duration:19s !important;animation-delay:-11s !important}
.ct-c3{--s:.5;animation-duration:24s !important;animation-delay:-6s !important}
.ct-c4{--s:.9;animation-duration:16s !important;animation-delay:-13s !important}
.pn-anim .ct-wind{animation:ct-gust 2.6s cubic-bezier(.4,0,.6,1) infinite}
.ct-w2{animation-delay:-.9s !important;animation-duration:2.2s !important}
.ct-w3{animation-delay:-1.7s !important;animation-duration:3s !important}
.pn-anim .ct-cruising .ct-cruise-b{animation:ct-bob 3.4s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){.pn-root *{animation:none !important;transition:none !important}}

</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="pn-root">

<sc-if value="{{mcompOpen}}" hint-placeholder-val="{{false}}">
<ul id="pn-msub" class="pn-msub">
<li><a class="pn-mi" href="/roadmap" onClick="{{closeAll}}">Roadmap</a></li>
<li><a class="pn-mi" href="/programs" onClick="{{closeAll}}">Programs</a></li>
<li><a class="pn-mi" href="/careers" onClick="{{closeAll}}">Careers</a></li>
</ul>
</sc-if>
</li>
<li><a class="pn-mi pn-cur" href="/contact" aria-current="page" onClick="{{closeAll}}">Contact</a></li>
</ul>

</div>

</header>

<main>


<main class="ct-main">
<div class="ct-fly" aria-hidden="true"><svg width="90" height="82" viewBox="198 20 90 82"><g><path d="M200 60 L286 22 L248 100 L232 74 Z" fill="#FFFFFF" stroke="#D9D2C4" stroke-width="1.5" stroke-linejoin="round"/><path d="M232 74 L286 22 L240 82 Z" fill="#E3EFEA"/><path d="M232 74 L238 96 L248 84" fill="#CFE3DB"/></g></svg></div>
<sc-if value="{{showRoutes}}" hint-placeholder-val="{{true}}">
<section class="{{routesCls}}" aria-labelledby="ct-h1">
<div class="pn-wrap">
